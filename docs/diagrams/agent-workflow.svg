<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-label="乡艺有据｜Agent任务执行与回退">
<rect width="1600" height="1220" fill="#f5f2e9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7b877e"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="65" y="76" font-size="37" fill="#223b33" font-weight="600">乡艺有据｜Agent任务执行与回退</text>
<text x="66" y="116" font-size="19" fill="#69716a">让模型决定下一步查什么，让程序确认事实引用、经营约束与费用是否成立。</text>
<rect x="65" y="175" width="420" height="120" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="175" width="5" height="120" fill="#91a183"/>
<text x="89" y="212" font-size="23" fill="#223b33" font-weight="600">01 接收与澄清</text>
<text x="89" y="246" font-size="18" fill="#69716a">地域、受众、人数、预算、时间</text>
<text x="89" y="274" font-size="18" fill="#69716a">歧义先询问，不擅自替用户决定</text>
<rect x="590" y="175" width="420" height="120" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="590" y="175" width="5" height="120" fill="#91a183"/>
<text x="614" y="212" font-size="23" fill="#223b33" font-weight="600">02 定向查证</text>
<text x="614" y="246" font-size="18" fill="#69716a">拆分事实 → 检索 → 查看上下文</text>
<text x="614" y="274" font-size="18" fill="#69716a">支持 / 矛盾 / 不足 / 冲突</text>
<rect x="1115" y="175" width="420" height="120" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="1115" y="175" width="5" height="120" fill="#91a183"/>
<text x="1139" y="212" font-size="23" fill="#223b33" font-weight="600">03 形成候选</text>
<text x="1139" y="246" font-size="18" fill="#69716a">按证据修订讲解；读取经营配置</text>
<text x="1139" y="274" font-size="18" fill="#69716a">轻体验 / 深体验等有限候选</text>
<path d="M485 235 H585" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1010 235 H1110" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="590" y="390" width="945" height="130" rx="7" fill="#223b33" stroke="#ccd2c4"/>
<rect x="590" y="390" width="5" height="130" fill="#b84631"/>
<text x="614" y="427" font-size="23" fill="#fffdf7" font-weight="600">04 程序验证</text>
<text x="614" y="461" font-size="18" fill="#fffdf7">来源ID存在，地域与版本一致；人数、时间、预算、容量可行</text>
<text x="614" y="489" font-size="18" fill="#fffdf7">禁公开/撤回素材不得用于对外版本；金额分项相加等于总账</text>
<path d="M1325 295 V385" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="390" width="420" height="130" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="390" width="5" height="130" fill="#91a183"/>
<text x="89" y="427" font-size="23" fill="#223b33" font-weight="600">资料不足或冲突</text>
<text x="89" y="461" font-size="18" fill="#69716a">补检索 / 向用户澄清 / 保留未知</text>
<text x="89" y="489" font-size="18" fill="#69716a">不以模型自信程度代替证据</text>
<path d="M700 295 V340 H275 V385" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="625" width="420" height="145" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="625" width="5" height="145" fill="#91a183"/>
<text x="89" y="662" font-size="23" fill="#223b33" font-weight="600">05 有界修订</text>
<text x="89" y="696" font-size="18" fill="#69716a">展示需要调整的条件</text>
<text x="89" y="724" font-size="18" fill="#69716a">用户确认后修订；不放宽禁忌</text>
<text x="89" y="752" font-size="18" fill="#69716a">最多2轮；所有模型调用统一计数</text>
<rect x="590" y="625" width="420" height="145" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="590" y="625" width="5" height="145" fill="#91a183"/>
<text x="614" y="662" font-size="23" fill="#223b33" font-weight="600">05 等待确认</text>
<text x="614" y="696" font-size="18" fill="#69716a">条件无解或资料仍不足</text>
<text x="614" y="724" font-size="18" fill="#69716a">保留已完成部分与缺口</text>
<text x="614" y="752" font-size="18" fill="#69716a">不把半成品标为完成</text>
<rect x="1115" y="625" width="420" height="145" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="1115" y="625" width="5" height="145" fill="#91a183"/>
<text x="1139" y="662" font-size="23" fill="#223b33" font-weight="600">05 通过并供人工复核</text>
<text x="1139" y="696" font-size="18" fill="#69716a">展示证据、约束报告与账本</text>
<text x="1139" y="724" font-size="18" fill="#69716a">用户选择合法方案</text>
<text x="1139" y="752" font-size="18" fill="#69716a">确认使用范围及经营状态</text>
<path d="M850 520 V574 H275 V620" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="445" y="562" font-size="16" fill="#69716a">可修复冲突</text>
<path d="M1000 520 V574 H800 V620" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="829" y="600" font-size="16" fill="#69716a">仍然未知</text>
<path d="M1325 520 V620" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1340" y="577" font-size="16" fill="#69716a">检查通过</text>
<path d="M65 696 H35 V330 H545 V455 H585" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="67" y="354" font-size="16" fill="#69716a">修订后重验</text>
<rect x="590" y="875" width="945" height="125" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="590" y="875" width="5" height="125" fill="#91a183"/>
<text x="614" y="912" font-size="23" fill="#223b33" font-weight="600">06 输出与版本记录</text>
<text x="614" y="946" font-size="18" fill="#69716a">内部草稿：待确认项显式保留；对外版本：受限内容替换或排除</text>
<text x="614" y="974" font-size="18" fill="#69716a">讲解卡 / 任务单 / 时间表 / 出处 / 费用流向 / 规则版本</text>
<path d="M1325 770 V870" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 770 V870" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="815" y="826" font-size="16" fill="#69716a">仅内部草稿</text>
<rect x="65" y="1060" width="1470" height="100" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="1060" width="5" height="100" fill="#91a183"/>
<text x="89" y="1097" font-size="23" fill="#223b33" font-weight="600">评测与真实状态</text>
<text x="89" y="1131" font-size="18" fill="#69716a">同模型同资料：固定强流程 vs 自适应Agent；记录误改、来源支持、整任务约束、耗时与调用数。预设演示不能当成实测。</text>
<path d="M1062 1000 V1055" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
</g>
</svg>
