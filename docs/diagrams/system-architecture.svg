<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-label="乡艺有据｜总体技术架构">
<rect width="1600" height="1160" fill="#f5f2e9"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7b877e"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="65" y="76" font-size="37" fill="#223b33" font-weight="600">乡艺有据｜总体技术架构</text>
<text x="66" y="116" font-size="19" fill="#69716a">本地模型 + 有状态Agent + 证据检索 + 确定性校验；当前为架构设计，AI后端待实现。</text>
<rect x="65" y="165" width="445" height="115" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="165" width="5" height="115" fill="#91a183"/>
<text x="89" y="202" font-size="23" fill="#223b33" font-weight="600">三页文化体验前端</text>
<text x="89" y="236" font-size="18" fill="#69716a">乡土发现 / 可信内容工坊 / 体验与共益</text>
<text x="89" y="264" font-size="18" fill="#69716a">React + TypeScript；当前已有离线原型</text>
<rect x="585" y="165" width="420" height="115" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="585" y="165" width="5" height="115" fill="#91a183"/>
<text x="609" y="202" font-size="23" fill="#223b33" font-weight="600">本地应用接口</text>
<text x="609" y="236" font-size="18" fill="#69716a">FastAPI · SSE阶段进度 · 体验包导出</text>
<text x="609" y="264" font-size="18" fill="#69716a">任务快照与人工确认</text>
<rect x="1080" y="165" width="455" height="115" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="1080" y="165" width="5" height="115" fill="#91a183"/>
<text x="1104" y="202" font-size="23" fill="#223b33" font-weight="600">现成中文模型 · 无需微调</text>
<text x="1104" y="236" font-size="18" fill="#69716a">Qwen3-14B Q4_K_M + Ollama</text>
<text x="1104" y="264" font-size="18" fill="#69716a">使用现有RTX 5090；不调用云API</text>
<path d="M510 223 H580" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M795 280 V335" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="340" width="730" height="145" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="465" y="340" width="5" height="145" fill="#91a183"/>
<text x="489" y="377" font-size="23" fill="#223b33" font-weight="600">LangGraph OSS · 有状态主Agent</text>
<text x="489" y="411" font-size="18" fill="#69716a">澄清地域 → 选择工具 → 根据缺口补查或修订</text>
<text x="489" y="439" font-size="18" fill="#69716a">同一模型承担不同任务；预算封顶，未知可停</text>
<text x="489" y="467" font-size="18" fill="#69716a">过程显示工具结果，不展示虚构思考</text>
<path d="M1307 280 V411 H1200" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1240" y="315" font-size="16" fill="#69716a">本地模型调用</text>
<rect x="65" y="540" width="335" height="310" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="65" y="540" width="5" height="310" fill="#91a183"/>
<text x="89" y="577" font-size="23" fill="#223b33" font-weight="600">本地资料与任务存储</text>
<text x="89" y="611" font-size="18" fill="#69716a">SQLite + 文件 + JSONL</text>
<text x="89" y="639" font-size="18" fill="#69716a">① 官方事实与地域版本</text>
<text x="89" y="667" font-size="18" fill="#69716a">② 素材来源与使用边界</text>
<text x="89" y="695" font-size="18" fill="#69716a">③ 演示/真实经营配置分开</text>
<text x="89" y="723" font-size="18" fill="#69716a">④ 社区意愿与撤回状态</text>
<text x="89" y="751" font-size="18" fill="#69716a">⑤ 任务、工具、模型版本记录</text>
<rect x="465" y="550" width="320" height="130" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="465" y="550" width="5" height="130" fill="#91a183"/>
<text x="489" y="587" font-size="23" fill="#223b33" font-weight="600">地域检索与查证</text>
<text x="489" y="621" font-size="18" fill="#69716a">BM25 + 实体/时间过滤</text>
<text x="489" y="649" font-size="18" fill="#69716a">来源ID与上下文定位</text>
<rect x="825" y="550" width="320" height="130" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="825" y="550" width="5" height="130" fill="#91a183"/>
<text x="849" y="587" font-size="23" fill="#223b33" font-weight="600">讲解修订与编排</text>
<text x="849" y="621" font-size="18" fill="#69716a">有出处的事实与创意分开</text>
<text x="849" y="649" font-size="18" fill="#69716a">最小修改，保留待确认</text>
<rect x="1185" y="550" width="350" height="130" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="1185" y="550" width="5" height="130" fill="#91a183"/>
<text x="1209" y="587" font-size="23" fill="#223b33" font-weight="600">计划与账本工具</text>
<text x="1209" y="621" font-size="18" fill="#69716a">时段 / 容量 / 预算 / 禁止事项</text>
<text x="1209" y="649" font-size="18" fill="#69716a">金额、比例与可行性由程序算</text>
<path d="M830 485 V515 H625 V545" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830 515 H985 V545" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M985 515 H1360 V545" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400 610 H460" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="413" y="597" font-size="16" fill="#69716a">读取</text>
<rect x="465" y="765" width="1070" height="130" rx="7" fill="#223b33" stroke="#ccd2c4"/>
<rect x="465" y="765" width="5" height="130" fill="#b84631"/>
<text x="489" y="802" font-size="23" fill="#fffdf7" font-weight="600">独立验证与使用边界</text>
<text x="489" y="836" font-size="18" fill="#fffdf7">检查引用存在、地域匹配、硬约束、金额总账、内容使用状态</text>
<text x="489" y="864" font-size="18" fill="#fffdf7">不支持 → 待确认；条件冲突 → 有界修订；受限素材 → 不进入对外版本</text>
<path d="M625 680 V716 H1000 V760" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M985 680 V710" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1360 680 V716 H1000" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="970" width="1070" height="115" rx="7" fill="#fffdf7" stroke="#ccd2c4"/>
<rect x="465" y="970" width="5" height="115" fill="#91a183"/>
<text x="489" y="1007" font-size="23" fill="#223b33" font-weight="600">人工确认后交付体验包</text>
<text x="489" y="1041" font-size="18" fill="#69716a">文化讲解卡 + 活动安排 + 来源清单 + 预算与本地服务支出 + 未确认项</text>
<text x="489" y="1069" font-size="18" fill="#69716a">内部草稿、可对外使用版本、模型实时运行与历史回放明确区分</text>
<path d="M1000 895 V965" fill="none" stroke="#7b877e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="65" y="1127" font-size="17" fill="#69716a">费用边界：新增软件许可/API费为零；现有硬件、电力与维护仍有成本。经营数据未接真实合作时均为演示假设。</text>
</g>
</svg>
